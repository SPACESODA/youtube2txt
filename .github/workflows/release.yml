name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (e.g. v1.4.3)'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check version and prepare draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node <<'JS'
          const { execFileSync } = require('node:child_process');
          const version = require('./package.json').version;
          const lock = require('./package-lock.json');
          const tag = process.env.RELEASE_TAG;
          if (tag !== `v${version}` || lock.version !== version || lock.packages[''].version !== version) {
            throw new Error('Release tag, package.json, and package-lock.json versions must match');
          }
          const gh = args => execFileSync('gh', args, { encoding: 'utf8' });
          let release;
          try { release = JSON.parse(gh(['release', 'view', tag, '--json', 'isDraft'])); }
          catch { gh(['release', 'create', tag, '--verify-tag', '--draft', '--title', `${tag} — building`, '--generate-notes']); }
          if (release && !release.isDraft) console.log('Rebuilding an existing published release; publication status will not be changed.');
          JS

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build release assets
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validate installers and updater checksums
        run: node scripts/release-assets.js local
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Upload installers then updater metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          node <<'JS'
          const { execFileSync } = require('node:child_process');
          const { expectedFiles } = require('./scripts/release-assets');
          const [manifest, ...binaries] = expectedFiles(process.platform, require('./package.json').version);
          const gh = files => execFileSync('gh', ['release', 'upload', process.env.RELEASE_TAG, ...files.map(name => `dist/${name}`), '--clobber'], { stdio: 'inherit' });
          gh(binaries);
          gh([manifest]);
          JS
      - name: Cleanup build artifacts
        run: node scripts/cleanup-dist.js

  verify:
    name: Verify complete release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify all uploaded assets and updater manifests
        run: node scripts/release-assets.js remote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Mark draft ready for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG"
